<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 跨所套利监控</title>
  <style>
    :root {
      --bg-a: #f3f8ff;
      --bg-b: #f2f7f0;
      --card: #ffffff;
      --ink: #1f2a37;
      --muted: #6b7280;
      --line: #e5edf5;
      --blue: #1b71ff;
      --red: #f04444;
      --shadow: 0 18px 50px rgba(15, 24, 40, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Smiley Sans", "Alibaba PuHuiTi", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 360px at -5% -10%, rgba(129, 199, 255, 0.35), transparent 60%),
        radial-gradient(900px 360px at 110% 0%, rgba(34, 197, 94, 0.22), transparent 50%),
        linear-gradient(180deg, var(--bg-a), var(--bg-b));
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(420px, 100%);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 26px 26px 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: 1px;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: var(--muted);
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: rgba(27, 113, 255, 0.4);
      box-shadow: 0 0 0 3px rgba(27, 113, 255, 0.12);
    }

    .field {
      margin-bottom: 14px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    button {
      border: none;
      background: var(--blue);
      color: #fff;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(27, 113, 255, 0.2);
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
    }

    .error {
      margin-top: 10px;
      color: var(--red);
      font-size: 12px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>跨所套利监控</h1>
    <p>请登录后进入监控页面。</p>
    <form id="login-form">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="actions">
        <button type="submit">登录</button>
        <span class="hint">默认账号: nxb / nxb</span>
      </div>
      <div class="error" id="error"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.textContent = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      try {
        const res = await fetch("api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || "登录失败";
          return;
        }
        window.location.href = "./";
      } catch (err) {
        errorEl.textContent = "网络错误，请重试";
      }
    });
  </script>
</body>
</html>
